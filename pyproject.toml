[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entif-codito"
version = "0.1.0"
description = "Executable reference models and research controls for Entif.AI Unified Cognitive Architecture"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Entif.AI" }]

[tool.setuptools.packages.find]
include = ["codito*"]
